services:
  - type: web
    name: contextforge
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MCP_TRANSPORT_TYPE
        value: http-stream
      - key: MCP_STATELESS
        value: 'true'
    plan: free
    healthCheckPath: /health

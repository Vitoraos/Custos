name: check

on:
  push:
    branches: [main, v3]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install simulator web dependencies
        run: npm ci --prefix simulator/web
      - name: Build simulator web
        run: npm run web:build
      - name: Check design tokens
        run: npm run web:tokens
